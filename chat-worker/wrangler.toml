name = "wubble-chat"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# sites allowed to call the chat (comma list)
ALLOWED_ORIGINS = "https://wubble.studio,https://www.wubble.studio,https://wubble-2-0.webflow.io,http://localhost:8321"
# the API key is a secret, never put it here: run `npx wrangler secret put ANTHROPIC_API_KEY`
